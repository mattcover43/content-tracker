<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Authorization result - Content Tracker</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:48px auto;padding:0 16px;line-height:1.6;color:#2B323F}textarea{width:100%;height:90px}</style></head>
<body>
<h1>Authorization result</h1>
<p id="msg">Reading result...</p>
<textarea id="out" readonly style="display:none"></textarea>
<script>
var p = new URLSearchParams(location.search);
var msg = document.getElementById('msg'), out = document.getElementById('out');
if (p.get('code')) {
  msg.textContent = 'Success. Copy the line below and paste it into the terminal where the login script is waiting. Do not share it.';
  out.style.display = 'block';
  out.value = 'code=' + p.get('code') + '\nstate=' + (p.get('state') || '');
  out.focus(); out.select();
} else if (p.get('error')) {
  msg.textContent = 'TikTok returned an error: ' + p.get('error') + ' - ' + (p.get('error_description') || '');
} else {
  msg.textContent = 'No authorization code in this address.';
}
</script>
</body></html>
